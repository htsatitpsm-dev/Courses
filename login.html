<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ | SCI - TECH</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#1d2a26;--muted:#667570;--line:#dbe3df;--brand:#c80909;--err:#c93c3c}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--ink:#e8f0ec;--muted:#93a39c;--line:#2a3631;--brand:#c80909;--err:#ff7b7b}}
*{box-sizing:border-box;margin:0}
body{font-family:"Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem;margin-bottom:22px}
.logo i{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal}
h1{font-size:1.4rem}
.sub{color:var(--muted);margin:4px 0 22px;font-size:.95rem}
label{display:block;font-weight:500;margin:14px 0 6px;font-size:.95rem}
.pw{position:relative}
input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
input:focus{outline:3px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);padding:6px 8px;cursor:pointer;font:inherit;font-size:.85rem}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:.9rem}
.row label{margin:0;display:flex;gap:6px;align-items:center;font-weight:400}
.row input{width:auto}
.row a{color:var(--brand)}
button.go{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.go:hover{filter:brightness(.95)}
button.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.msg{min-height:1.4em;margin-top:12px;color:var(--err);font-size:.9rem}
.foot{margin-top:18px;text-align:center;font-size:.92rem;color:var(--muted)}.foot a{color:var(--brand);font-weight:500}.msg.ok{color:var(--brand)}button.go:disabled{opacity:.6;cursor:wait}
.hint{margin-top:18px;padding:10px 12px;background:var(--bg);border-radius:8px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main class="box">
  <div class="logo"><i>HT</i>SCI - TECH</div>
  <h1>เข้าสู่ระบบ</h1>
  <p class="sub">คอร์สเรียนออนไลน์ SCI - Project</p>

  <form id="f" novalidate>
    <label for="u">อีเมลหรือชื่อผู้ใช้</label>
    <input id="u" autocomplete="username" required>

    <label for="p">รหัสผ่าน</label>
    <div class="pw">
      <input id="p" type="password" autocomplete="current-password" required>
      <button type="button" class="eye" id="eye" aria-label="แสดงรหัสผ่าน">แสดง</button>
    </div>

    <div class="row">
      <label><input type="checkbox" id="remember"> จดจำฉันไว้</label>
      <a href="forgot.html">ลืมรหัสผ่าน?</a>
    </div>

    <p class="msg" id="msg" role="alert"></p>
    <button class="go" id="btn" type="submit">เข้าสู่ระบบ</button>
  </form>

  <p class="foot">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
</main>

<script src="config.js"></script>
<script>
const NEXT_PAGE = "course.html";
const $ = id => document.getElementById(id);

if (location.search.includes('registered=1') || location.search.includes('reset=1')) {
  $('msg').textContent = location.search.includes('reset=1')
    ? 'ตั้งรหัสผ่านใหม่แล้ว เข้าสู่ระบบด้วยรหัสใหม่ได้เลย'
    : 'สมัครสำเร็จแล้ว เข้าสู่ระบบได้เลย';
  $('msg').classList.add('ok');
}

$('eye').onclick = () => {
  const show = $('p').type === 'password';
  $('p').type = show ? 'text' : 'password';
  $('eye').textContent = show ? 'ซ่อน' : 'แสดง';
};

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const u = $('u').value.trim(), p = $('p').value;
  $('msg').classList.remove('ok');
  if (!u || !p) { $('msg').textContent = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่านให้ครบ'; return; }

  $('btn').disabled = true; $('btn').textContent = 'กำลังตรวจสอบ...'; $('msg').textContent = '';
  const r = await callSheet({ action: 'login', username: u, password: p });
  $('btn').disabled = false; $('btn').textContent = 'เข้าสู่ระบบ';

  if (!r.ok) { $('msg').textContent = r.error || 'เข้าสู่ระบบไม่สำเร็จ'; return; }
  try {
    const store = $('remember').checked ? localStorage : sessionStorage;
    store.setItem('meddent_user', r.username);
    store.setItem('meddent_name', r.name);
  } catch (err) {}
  location.href = NEXT_PAGE;
});
</script>
</body>
</html>
