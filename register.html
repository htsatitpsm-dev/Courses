<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมัครสมาชิก | MEDDENT</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#1d2a26;--muted:#667570;--line:#dbe3df;--brand:#c80909;--err:#c93c3c}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--ink:#e8f0ec;--muted:#93a39c;--line:#2a3631;--brand:#c80909;--err:#ff7b7b}}
*{box-sizing:border-box;margin:0}
body{font-family:"Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem;margin-bottom:22px}
.logo i{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal}
h1{font-size:1.4rem}
.sub{color:var(--muted);margin:4px 0 12px;font-size:.95rem}
label{display:block;font-weight:500;margin:14px 0 6px;font-size:.95rem}
input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
input:focus{outline:3px solid var(--brand);outline-offset:0;border-color:var(--brand)}
small{color:var(--muted);font-size:.8rem}
button.go{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.6;cursor:wait}
button.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.msg{min-height:1.4em;margin-top:12px;color:var(--err);font-size:.9rem}
.msg.ok{color:var(--brand)}
.foot{margin-top:18px;text-align:center;font-size:.92rem;color:var(--muted)}
.foot a{color:var(--brand);font-weight:500}
</style>
</head>
<body>
<main class="box">
  <div class="logo"><i>HT</i>SCI - TECH</div>
  <h1>สมัครสมาชิก</h1>
  <p class="sub">สร้างบัญชีเพื่อเริ่มเรียนคอร์ส</p>

  <form id="f" novalidate>
    <label for="name">ชื่อ-นามสกุล</label>
    <input id="name" autocomplete="name" required>

    <label for="username">ชื่อผู้ใช้</label>
    <input id="username" autocomplete="username" required>
    <small>a-z, 0-9, _ หรือ . ความยาว 3-20 ตัว</small>

    <label for="email">อีเมล</label>
    <input id="email" type="email" autocomplete="email" required>

    <label for="p">รหัสผ่าน</label>
    <input id="p" type="password" autocomplete="new-password" required>
    <small>อย่างน้อย 6 ตัวอักษร</small>

    <label for="p2">ยืนยันรหัสผ่าน</label>
    <input id="p2" type="password" autocomplete="new-password" required>

    <p class="msg" id="msg" role="alert"></p>
    <button class="go" id="btn" type="submit">สมัครสมาชิก</button>
  </form>

  <p class="foot">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
</main>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const say = (t, ok) => { $('msg').textContent = t; $('msg').className = 'msg' + (ok ? ' ok' : ''); };

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const d = {
    action: 'register',
    name: $('name').value.trim(),
    username: $('username').value.trim(),
    email: $('email').value.trim(),
    password: $('p').value
  };
  if (!d.name || !d.username || !d.email || !d.password) return say('กรุณากรอกข้อมูลให้ครบ');
  if (!/^[A-Za-z0-9_.]{3,20}$/.test(d.username)) return say('ชื่อผู้ใช้ต้องเป็น a-z 0-9 _ . ยาว 3-20 ตัว');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return say('รูปแบบอีเมลไม่ถูกต้อง');
  if (d.password.length < 6) return say('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
  if (d.password !== $('p2').value) return say('รหัสผ่านทั้งสองช่องไม่ตรงกัน');

  $('btn').disabled = true; $('btn').textContent = 'กำลังสมัคร...'; say('');
  const r = await callSheet(d);
  $('btn').disabled = false; $('btn').textContent = 'สมัครสมาชิก';

  if (!r.ok) return say(r.error || 'สมัครไม่สำเร็จ');
  say('สมัครสำเร็จ กำลังพาไปหน้าเข้าสู่ระบบ...', true);
  setTimeout(() => location.href = 'login.html?registered=1', 1200);
});
</script>
</body>
</html>
