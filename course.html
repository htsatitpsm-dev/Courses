<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCI - TECH | คอร์สของฉัน</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7f6; --card:#fff; --ink:#1d2a26; --muted:#667570; --line:#e3e9e6;
  --brand:#14a37f; --brand-soft:#e3f6f0; --amber:#fdc55a; --amber-ink:#3a2a00;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121816;--card:#1b2420;--ink:#e8f0ec;--muted:#93a39c;--line:#2a3631;--brand:#c80909;--brand-soft:#173a30;--amber:#e0ac3e;--amber-ink:#1d1500}
}
*{box-sizing:border-box;margin:0}
body{font-family:"Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* header */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.nav{max-width:1400px;margin:auto;display:flex;align-items:center;gap:28px;padding:12px 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem}
.logo i{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal}
.menu{display:flex;gap:22px;font-weight:500;flex:1}
.menu a:hover{color:var(--brand)}
.my{color:var(--brand);font-weight:500}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}

/* layout */
.wrap{max-width:1400px;margin:auto;padding:20px 24px;display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start}
.side{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.course{display:flex;gap:14px;padding:18px}
.thumb{width:98px;height:56px;border-radius:6px;background:linear-gradient(135deg,#8e8d8d,#ff0000);flex:none;display:grid;place-items:center;color:#fff;font-size:.65rem;text-align:center;padding:4px}
.course h2{font-size:1.15rem;line-height:1.3}
.course p{color:var(--muted);font-size:.9rem;margin-top:4px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}

/* accordion */
.acc{border-radius:10px;overflow:hidden}
.acc-btn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border:0;background:var(--amber);color:var(--amber-ink);font-weight:700;text-align:left;border-bottom:1px solid rgba(0,0,0,.08)}
.acc-btn svg{transition:transform .2s}
.acc-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.acc-body{background:var(--card);padding:10px;display:none}
.acc-body.open{display:block}
.lesson{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:2px solid transparent;border-radius:10px;background:none;color:var(--ink);text-align:left}
.lesson:hover{background:var(--bg)}
.lesson.active{border-color:var(--brand);background:var(--brand-soft)}
.lesson small{color:var(--muted);display:block}
.lesson .t{flex:1}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.done .tick{border-color:var(--brand);color:var(--brand)}
.side{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.side > *{flex-shrink:0}
.side{scrollbar-width:thin}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}

/* main */
.crumb{padding:14px 20px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.95rem;flex-wrap:wrap}
.crumb a:hover{color:var(--brand)} .crumb b{color:var(--ink);font-weight:500}
.player{margin-top:16px;background:#222;padding:20px;border-radius:6px}
.player video{width:100%;aspect-ratio:16/9;background:#fff;display:block}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.spacer{flex:1}
.info{padding:20px;margin-top:16px}
.info h1{font-size:1.4rem}
.info p{color:var(--muted);margin-top:6px}

@media(max-width:960px){
  .wrap{grid-template-columns:1fr}
  .side{position:static;max-height:none;order:2}
  .menu{display:none}
  .nav{justify-content:space-between}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
/* ถ้ายังไม่ล็อกอิน ให้เด้งกลับไปหน้า login */
(function(){
  let u=null;
  try{u=localStorage.getItem('meddent_user')||sessionStorage.getItem('meddent_user')}catch(e){}
  if(!u) location.replace('login.html');
})();
</script>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="#"><i>HT</i>SCI - TECH </a>
    <nav class="menu">
      <a href="#">หน้าแรก</a>
    </nav>
    <a class="my" href="#">คอร์สของฉัน</a>
    <div class="avatar" aria-label="บัญชีผู้ใช้">👤</div>
    <a href="index.html" id="logout" class="my" style="color:var(--muted)">ออกจากระบบ</a>
  </div>
</header>

<div class="wrap">
  <!-- sidebar -->
  <aside class="side">
    <div class="card course">
      <div class="thumb">TECH</div>
      <div style="flex:1">
        <h2>คอร์สพื้นฐาน Technology</h2>
        <p>ใช้ชั่วโมงเรียนไปแล้ว <span id="hrs">0:00</span> ชั่วโมงจาก 280 ชั่วโมง<br></p>
        <div class="bar"><b id="prog"></b></div>
      </div>
    </div>
    <div id="accordion" class="card acc"></div>
  </aside>

  <!-- main -->
  <main>
    <div class="card crumb">
      <a href="#">🏠 คอร์สของฉัน</a> › <b id="crumbLesson"></b>
    </div>

    <div class="player">
      <!-- เปลี่ยน src เป็นไฟล์วิดีโอของคุณ (.mp4) -->
      <video id="video" controls controlsList="nodownload" poster="" src=""></video>
    </div>

    <div class="tools">
      <button class="btn" id="prev">‹ บทก่อนหน้า</button>
      <button class="btn" id="speed">ความเร็ว 1x</button>
      <span class="spacer"></span>
      <button class="btn" id="markDone">✓ ทำเครื่องหมายว่าเรียนจบ</button>
      <button class="btn pri" id="next">บทถัดไป ›</button>
    </div>

    <div class="card info">
      <h1 id="title">เซต 1/8</h1>
      <p id="desc">ความหมายของเซต: คือ “กลุ่ม” ของอะไรบางอย่าง โดยบอกได้แน่นอนว่าสิ่งนั้นอยู่ในกลุ่มหรือไม่</p>
    </div>
  </main>
</div>

<script>
/* ===== ข้อมูลคอร์ส: แก้ตรงนี้ได้เลย (video = ลิงก์ไฟล์ .mp4) ===== */
const chapters = [
  {name:"บทที่ 0: พื้นฐาน", lessons:[
    {title:"Setup Program", dur:"0:12:30", video:"", desc:"สอนวิธีติดตั้งโปรแกรมที่จำเป็นประกอบไปด้วย Arduino IDE , Visual Studio Code"},
    {title:"พื้นฐานภาษา Python", dur:"0:12:30", video:"", desc:"สอนพื้นฐานภาษา Python "},
    {title:"พื้นฐานภาษา C++", dur:"0:12:30", video:"", desc:"สอนพื้นฐานภาษา C++ "},
    {title:"พื้นฐานการต่อวงจรไฟฟ้า", dur:"0:12:30", video:"", desc:"สอนพื้นฐานการต่อวงจรไฟฟ้าเบื้องต้น"},
    {title:"พื้นฐานการใช้งานเซนเซอร์", dur:"0:12:30", video:"", desc:"สอนพื้นฐานการใช้งาน Sensor กับ Microcontroller"},
    {title:"พื้นฐานการใช้งานแหล่งจ่ายไฟ", dur:"0:12:30", video:"", desc:"สอนพื้นฐานการใช้งานมแหล่งจ่ายไฟต่าง ๆ เช่น แบตเตอรี่"},
  ]},
  {name:"บทที่ 1: พื้นฐาน AI", lessons:[
    {title:"การเทรนโมเดล AI 1/2", dur:"0:12:30", video:"", desc:"สอนการเทรนโมเดล AI ด้วยชุดข้อมูลรูปภาพ"},
    {title:"การเทรนโมเดล AI 2/2", dur:"0:12:30", video:"", desc:"สอนการเทรนโมเดล AI ด้วยชุดข้อมูลตัวเลข"},
    {title:"การใช้งานโมเดล AI", dur:"0:12:30", video:"", desc:"สอนการใช้งานโมเดล AI ที่เทรนเสร็จแล้ว"},
  ]},
  {name:"บทที่ 2: HTML/CSS", lessons:[
    {title:"การสร้างหน้าเว็บด้วย HTML", dur:"0:12:30", video:"" , desc:"สอนการสร้างหน้าเว็บด้วยภาษา HTML"},
    {title:"การตกแต่งหน้าเว็บด้วย CSS", dur:"0:12:30", video:"" , desc:"สอนการตกแต่งหน้าเว็บด้วยภาษา CSS"},
    {title:"deploy หน้าเว็บด้วย GitHub Pages", dur:"0:12:30", video:"" , desc:"สอนการ deploy หน้าเว็บด้วย GitHub Pages"},
  ]},
  {name:"บทที่ 3: Web App", open:true, lessons:[
    {title:"การใช้งานเว็บแอปพร้อมอุปกรณ์", dur:"0:57:52", video:"", desc:"สอนการใช้งานเว็บแอปพร้อมอุปกรณ์ต่าง ๆ เช่น Arduino, ESP32"},
  ]},
  {name:"บทที่ 4: 3D Printing", open:true, lessons:[
    {title:"การออกแบบ Model 3D", dur:"0:57:52", video:""},
    {title:"การตรวจสอบ Model 3D ก่อนการพิมพ์", dur:"0:57:52", video:""}
  ]},
  {name:"บทที่ 5: PCB", open:true, lessons:[
    {title:"Dowload EasyEDA", dur:"0:57:52", video:""},
    {title:"การออกแบบ PCB ", dur:"0:57:52", video:"", desc:"สอนการออกแบบ PCB ด้วยโปรแกรม EasyEDA"},
    {title:"การสั่งผลิต PCB", dur:"0:57:52", video:"", desc:"สอนการสั่งผลิต PCB จากJLCPCB"},
  ]},
  {name:"บทที่ 6: Final Project", open:true, lessons:[
    {title:"การใช้บอร์ดเล็ก", dur:"0:57:52", video:"", desc:""},
  ]},
  {name:"บทที่ 7: เอกสารสิทธิบัตร", open:true, lessons:[
    {title:"การเตรียมเอกสาร", dur:"0:57:52", video:"", desc:""},
    {title:"การยื่นเอกสาร", dur:"0:57:52", video:"", desc:""},
  ]}
];

const acc = document.getElementById('accordion');
const flat = [];            // รายการบทเรียนทั้งหมดเรียงต่อกัน
let current = 0;

const chev = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>';
const toSec = s => s.split(':').reduce((a,v)=>a*60+ +v,0);

chapters.forEach((ch,ci)=>{
  const btn = document.createElement('button');
  btn.className='acc-btn'; btn.setAttribute('aria-expanded', !!ch.open);
  btn.innerHTML = `<span>${ch.name}</span>${chev}`;
  const body = document.createElement('div');
  body.className='acc-body'+(ch.open?' open':'');
  if(!ch.lessons.length) body.style.display='none';
  btn.onclick=()=>{
    const o = body.classList.toggle('open');
    body.style.display = o ? 'block' : '';
    btn.setAttribute('aria-expanded', o);
  };
  ch.lessons.forEach(ls=>{
    const i = flat.push(ls)-1;
    const el = document.createElement('button');
    el.className='lesson'+(ls.done?' done':'');
    el.innerHTML = `<span>🎬</span><span class="t">${ls.title}<small>${ls.dur}</small></span><span class="tick">✓</span>`;
    el.onclick=()=>play(i);
    ls.el = el; body.appendChild(el);
  });
  acc.append(btn, body);
});

const $ = id => document.getElementById(id);
$('logout').onclick=()=>{try{localStorage.removeItem('meddent_user');sessionStorage.removeItem('meddent_user')}catch(e){}};
const video = $('video');

function play(i){
  if(i<0||i>=flat.length) return;
  current=i; const ls=flat[i];
  flat.forEach(l=>l.el.classList.remove('active')); ls.el.classList.add('active');
  $('crumbLesson').textContent = $('title').textContent = ls.title;
  $('desc').textContent = ls.desc || '';
  if(ls.video){ video.src=ls.video; video.load(); }
  $('markDone').textContent = ls.done ? '✓ เรียนจบแล้ว' : '✓ ทำเครื่องหมายว่าเรียนจบ';
}

function refresh(){
  const done = flat.filter(l=>l.done);
  const secs = done.reduce((a,l)=>a+toSec(l.dur),0);
  const h=Math.floor(secs/3600), m=String(Math.floor(secs%3600/60)).padStart(2,'0');
  $('hrs').textContent = `${h}:${m}`;
  $('prog').style.width = (done.length/flat.length*100)+'%';
}

$('markDone').onclick=()=>{
  const ls=flat[current]; ls.done=!ls.done;
  ls.el.classList.toggle('done',ls.done); play(current); refresh();
};
$('next').onclick=()=>play(current+1);
$('prev').onclick=()=>play(current-1);
video.addEventListener('ended',()=>{
  const ls=flat[current]; ls.done=true; ls.el.classList.add('done'); refresh(); play(current+1);
});

const speeds=[1,1.25,1.5,2,0.75]; let si=0;
$('speed').onclick=()=>{
  si=(si+1)%speeds.length; video.playbackRate=speeds[si];
  $('speed').textContent=`ความเร็ว ${speeds[si]}x`;
};

refresh(); play(0);
</script>
</body>
</html>
